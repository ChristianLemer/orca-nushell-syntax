name: Upstream grammar

# Once a week, look whether upstream changed the grammar, and open an issue when it did.
# The sync itself stays a decision: someone runs the script, looks at the samples, releases.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.117.0"
      - name: Sync into the working copy, without committing
        run: nu scripts/sync-grammar.nu
      - name: Open an issue when the grammar or its license changed
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Upstream changed the grammar
        run: |
          if git diff --quiet -- syntaxes; then
            echo "Upstream's grammar and license are the ones we ship."
            exit 0
          fi
          if [ -n "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            echo "An issue is already open."
            exit 0
          fi
          sha="$(grep -oE 'upstream commit `[0-9a-f]{40}`' README.md | grep -oE '[0-9a-f]{40}')"
          {
            echo "nushell/vscode-nushell-lang changed what this plugin copies. Its \`main\` is at \`$sha\`."
            echo
            echo '```'
            git diff --stat -- syntaxes
            echo '```'
            echo
            echo "To bring it in: run \`scripts/sync-grammar.nu\`, update the token snapshots (\`npm run update\` in \`tests/\`) and read their diff, look at the samples in Orca, then release. \`AGENTS.md\` has the details."
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md
